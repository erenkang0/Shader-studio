name: Build & Release APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ShaderStudio-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShaderStudio-APK
          path: ShaderStudio-v1.0.0.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Shader Studio v1.0.0
          make_latest: true
          body: |
            # Shader Studio v1.0.0 🎨

            GPU-powered photo editor for **Android 14+** built with **Material 3 Expressive** and **AGSL runtime shaders**.

            ## Effects
            - **Dot Matrix** — LED / halftone poster look
            - **Fluted Glass** — ribbed glass refraction
            - **Liquid Sky** — flowing "viral gradient" blend (animated)
            - **Glitch** — chromatic row displacement (animated)
            - **Mosaic** — pixel poster + posterize
            - **VHS** — retro tape wobble, scanlines, grain (animated)
            - **Duotone** — two-tone poster mapping
            - **Ripple** — liquid wave distortion (animated)

            ## Install
            Download `ShaderStudio-v1.0.0.apk` below and install it (requires Android 14 or newer).

            All effects render in real time on the GPU and export at full resolution to your gallery.
          files: ShaderStudio-v1.0.0.apk

name: Build & Release APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ShaderStudio-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShaderStudio-APK
          path: ShaderStudio-v1.0.0.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Shader Studio v1.0.0
          make_latest: true
          body: |
            # Shader Studio v1.0.0 🎨

            GPU-powered photo editor for **Android 14+** built with **Material 3 Expressive** and **AGSL runtime shaders**.

            ## 33 shader effects
            Dot Matrix, Fluted Glass, Liquid Sky, Glitch, Mosaic, VHS, Duotone,
            Ripple, Kaleidoscope, Swirl, Lens, Tilt Shift, CRT, Print Press,
            Sketch, Oil Flow, Neon Edge, Emboss, Thermal, Solarize, Poster Pop,
            Scan Slice, Mirror, Chroma Zoom, Rain Glass, Hex Pixel, Linescreen,
            Weave, Chroma Wave, Bloom, Night Vision, Pop Dots, Aurora.

            Animated effects render with a live time uniform; every effect has
            up to three adjustable parameters.

            ## Install
            Download `ShaderStudio-v1.0.0.apk` below and install it (requires Android 14 or newer).

            All effects render in real time on the GPU and export at full resolution to your gallery.
          files: ShaderStudio-v1.0.0.apk

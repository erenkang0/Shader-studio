name: Build & Release APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ShaderStudio-v1.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShaderStudio-APK
          path: ShaderStudio-v1.1.0.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Shader Studio v1.1.0
          make_latest: true
          body: |
            # Shader Studio v1.1.0 🎨

            GPU-powered photo editor for **Android 14+** built with **Material 3 Expressive** and **AGSL runtime shaders**.

            ## 58 shader effects
            **Poster & print:** Dot Matrix, Print Press, Pop Dots, Linescreen, Sketch, Bit Dither, Poster Pop, Duotone, Toon, Watercolor, Oil Flow
            **Glass & distortion:** Fluted Glass, Rain Glass, Stained Glass, Lens, Swirl, Ripple, Flag Wave, Heat Haze, Underwater, Time Smear, Kaleidoscope, Quad Mirror, Mirror, Little Planet
            **Retro & tape:** VHS, CRT, Old Film, Film Fade, Game Boy, Night Vision, Lomo, Negative, Solarize, Infrared, Thermal
            **Glitch & chroma:** Glitch, Scan Slice, Pixel Sort, Chroma Wave, Chroma Zoom, Anaglyph, Double Ghost
            **Mosaic & pixel:** Mosaic, Hex Pixel, Tri Mosaic, Weave, Emboss
            **Light & overlay:** Liquid Sky, Aurora, Matrix Rain, Sparkle, Bloom, Prism Leak, Neon Edge, Motion Blur, Spin Blur, Tilt Shift

            13 animated effects render with a live time uniform; every effect has
            up to three adjustable parameters.

            ## Install
            Download `ShaderStudio-v1.1.0.apk` below and install it (requires Android 14 or newer).

            All effects render in real time on the GPU and export at full resolution to your gallery.
          files: ShaderStudio-v1.1.0.apk
